<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E✈%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e2da;--acc:#0f766e;--acc2:#e0f2ef;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--good:#15803d;--goodbg:#dcfce7}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1a1f27;--ink:#e7e9ee;--mute:#9aa3b2;--line:#2a313c;--acc:#2dd4bf;--acc2:#123532;--warn:#fbbf24;--warnbg:#3a2d0c;--bad:#f87171;--badbg:#3b1414;--good:#4ade80;--goodbg:#0f2e1c}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 12px 0 0;letter-spacing:.2px}h1 span{color:var(--acc)}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.sp{flex:1}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.sm{padding:3px 9px;font-size:12px}button.danger{color:var(--bad)}
nav{display:flex;gap:4px;padding:10px 22px 0}nav button{border:none;background:none;padding:8px 14px;border-bottom:2px solid transparent;border-radius:0;color:var(--mute)}nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:18px 22px 60px;max-width:1300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0;font-size:15px}.sub{color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prices{display:flex;gap:18px;margin:10px 0 6px}.prices div b{display:block;font-size:20px}.prices small{color:var(--mute)}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--mute)}.pill.ok{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.top{font-size:12px;margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}.top div{display:flex;justify-content:space-between}
a{color:var(--acc)}
svg.spark{width:100%;height:46px;display:block}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}.toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:520px;white-space:pre-wrap;font-size:13px;box-shadow:0 6px 20px #0003}
.toast div.err{background:var(--bad);color:#fff}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:#0007}.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.dh h2{margin:0;font-size:16px;flex:1}
.db{padding:16px 18px;overflow:auto;max-height:calc(92vh - 120px)}.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 12px}legend{color:var(--mute);font-size:12px;padding:0 4px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none;background:var(--bg)}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.empty{color:var(--mute);padding:40px;text-align:center}
.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>✈ Flight <span>Low</span> Tracker</h1>
  <span class="badge" id="mode">…</span>
  <span class="sub" id="upd"></span><span class="badge" id="busy" hidden></span>
  <span class="sp"></span>
  <button id="signout" hidden onclick="signOut()" title="Forget the GitHub token in this browser">🔑</button>
  <button onclick="dispatch('run')" title="Run watches that are due now">Run due</button>
  <button onclick="dispatch('force-run')" title="Run every enabled watch now">Run all now</button>
  <button onclick="dispatch('probe')" title="Phase-0 data check for all routes">Probe data</button>
  <button onclick="dispatch('test-discord')">Test Discord</button>
  <button class="pri" onclick="editWatch(-1)">+ New watch</button>
</header>
<nav><button data-t="watches" class="on">Watches</button><button data-t="settings">Airports & settings</button><button data-t="activity">Activity & data health</button></nav>
<main>
  <section id="t-watches"><div class="row" id="filters" style="margin-bottom:12px"></div><div class="grid" id="cards"></div>
  <p class="sub" style="margin-top:14px">⚠️ self-transfer: two separate tickets with real cached fares · ≈ estimate: real hub→destination fare + your typical origin→hub fare (the domestic flight is not a specific booking) · all fares are cached from the last ~48 h — confirm before booking.</p></section>
  <section id="t-settings" hidden></section>
  <section id="t-activity" hidden></section>
</main>
<div class="toast" id="toast"></div>

<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button class="sm" onclick="dlg.close()">✕</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>

<script>
const AIRPORTS={KNU:"Kanpur",LKO:"Lucknow",DEL:"Delhi",NAG:"Nagpur",JLR:"Jabalpur",RPR:"Raipur",BHO:"Bhopal",IDR:"Indore",VNS:"Varanasi",BOM:"Mumbai",CCU:"Kolkata",BLR:"Bengaluru",HYD:"Hyderabad",MAA:"Chennai",AMD:"Ahmedabad",COK:"Kochi",GOI:"Goa",JAI:"Jaipur",PNQ:"Pune",
GAU:"Guwahati",IXZ:"Port Blair",IXL:"Leh",IXB:"Bagdogra (Siliguri)",DED:"Dehradun",SXR:"Srinagar",IXC:"Chandigarh",ATQ:"Amritsar",
BKK:"Bangkok",DMK:"Bangkok DMK",HKT:"Phuket",CNX:"Chiang Mai",HAN:"Hanoi",SGN:"Ho Chi Minh",DAD:"Da Nang",DXB:"Dubai",AUH:"Abu Dhabi",SHJ:"Sharjah",DOH:"Doha",MCT:"Muscat",KUL:"Kuala Lumpur",SIN:"Singapore",DPS:"Bali",CMB:"Colombo",KTM:"Kathmandu",MLE:"Malé",PBH:"Paro",DAC:"Dhaka",HKG:"Hong Kong",NRT:"Tokyo",ICN:"Seoul",IST:"Istanbul",TBS:"Tbilisi",ALA:"Almaty",TAS:"Tashkent",BAK:"Baku",LHR:"London",CDG:"Paris",FRA:"Frankfurt"};
const INDIA=["KNU","LKO","DEL","NAG","JLR","RPR","BHO","IDR","VNS","BOM","CCU","BLR","HYD","MAA","AMD","JAI","PNQ","GOI","COK"];
const DOMESTIC=["GAU","IXZ","IXL","IXB","DED","SXR","IXC","ATQ","GOI","COK"];
const INDIA_ALL=new Set([...INDIA,...DOMESTIC]);
const DESTS=[...DOMESTIC,"BKK","HKT","HAN","SGN","DAD","DXB","AUH","SHJ","DOH","MCT","KUL","SIN","DPS","CMB","KTM","MLE","PBH","HKG","NRT","ICN","IST","TBS","ALA","TAS","BAK"];
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let CFG=null, ST={watches:{},meta:{}}, HIST={};
const $=s=>document.querySelector(s), dlg=$("#dlg");
const inr=x=>x==null||x===""?"–":"₹"+Math.round(+x).toLocaleString("en-IN");
const fmtD=s=>s?new Date(s+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short"}):"–";
const ago=s=>{if(!s)return"never";const m=(Date.now()-new Date(s))/6e4;return m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const mark=o=>o?.kind==="self_transfer"?" ⚠️":o?.kind==="estimate"?" ≈":"";
const px=o=>o?(o.kind==="estimate"?"≈\u00a0":"")+inr(o.price):"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg,err){const d=document.createElement("div");d.textContent=msg;if(err)d.className="err";$("#toast").append(d);setTimeout(()=>d.remove(),err?12000:6000)}
async function api(path,opt={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["watches","settings","activity"].forEach(t=>$("#t-"+t).hidden=t!==b.dataset.t);if(b.dataset.t==="settings")renderSettings();if(b.dataset.t==="activity")renderActivity()});

/* ================= backends =================
   LOCAL  – served by `python -m ui` (FastAPI /api/*)
   GH     – static page (e.g. GitHub Pages): talks to the private repo through the GitHub API
            with a token kept only in this browser's localStorage. */
const LOCAL={mode:"local",
  info:()=>api("/api/info"),config:()=>api("/api/config"),state:()=>api("/api/state"),
  history:id=>api("/api/history/"+id),probe:()=>api("/api/probe"),runs:()=>api("/api/runs"),
  putConfig:(raw,sha,message)=>api("/api/config",{method:"PUT",body:JSON.stringify({raw,sha,message})}),
  dispatch:(action,watch)=>api("/api/dispatch",{method:"POST",body:JSON.stringify({action,watch})})};

const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const b64enc=s=>{let bin="";new TextEncoder().encode(s).forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)};
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const h=rows.shift()||[];return rows.filter(r=>r.length>1||r[0]).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])))}

const SET_DEFAULTS={currency:"INR",market:"in",fare_method:"grouped",request_pause_s:0.35,min_connect_hours:3,max_layover_hours:24,default_leg_minutes:180,no_data_alert_after:2,digest_time_ist:"21:30",stale_after_hours:26,estimate_lookback_days:30};
const HEADER="# Flight Tracker configuration — edited by the control panel.\n# Times are IST. GitHub runs the checker every 3 h; a watch runs at the first check after each time.\n\n";
const IATA=/^[A-Z]{3}$/,HHMM=/^([01]\d|2[0-3]):[0-5]\d$/;
const hhmm=t=>typeof t==="number"?String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"):String(t).trim();
function resolveCodes(val,groups,where){const items=[].concat(val??[]);const out=[];
  for(const it of items){const s=String(it).trim();if(groups[s.toLowerCase()]){out.push(...groups[s.toLowerCase()]);continue}
    const u=s.toUpperCase();if(!IATA.test(u))throw new Error(`${where}: '${it}' is not an IATA code or a known group`);out.push(u)}
  const d=[...new Set(out)];if(!d.length)throw new Error(where+": empty");return d}
function checkConfig(raw){ /* mirrors tracker/config.py; the tests workflow re-validates on every push */
  const groups={};for(const[g,cs]of Object.entries(raw.groups||{})){const c=(cs||[]).map(x=>String(x).trim().toUpperCase());c.forEach(x=>{if(!IATA.test(x))throw new Error(`group ${g}: bad code ${x}`)});groups[g.toLowerCase()]=c}
  (raw.hubs||[]).forEach(h=>{if(!IATA.test(String(h).toUpperCase()))throw new Error("hubs: bad code "+h)});
  const st={...SET_DEFAULTS,...(raw.settings||{})};if(st.digest_time_ist&&!HHMM.test(hhmm(st.digest_time_ist)))throw new Error("Digest time must be HH:MM");
  if(!["grouped","dates","both"].includes(st.fare_method))throw new Error("fare_method must be grouped, dates or both");
  const resolved={},seen=new Set();
  (raw.watches||[]).forEach((w,i)=>{const id=String(w.id||"");if(!/^[a-z0-9][a-z0-9_-]{0,47}$/.test(id))throw new Error(`watch ${i+1}: bad id '${id}'`);
    if(seen.has(id))throw new Error("duplicate id "+id);seen.add(id);
    const o=resolveCodes(w.origins,groups,id+".origins"),d=resolveCodes(w.destinations,groups,id+".destinations");
    if(w.trip&&!["one_way","round_trip"].includes(w.trip))throw new Error(id+": bad trip type");
    const win=+(w.window_days??60),lead=+(w.min_lead_days??1);if(!(win>=7&&win<=330))throw new Error(id+": look-ahead must be 7..330 days");
    if(!(lead>=0&&lead<win))throw new Error(id+": earliest departure must be below look-ahead");
    (w.times_ist||[]).forEach(t=>{if(!HHMM.test(hhmm(t)))throw new Error(`${id}: bad time ${t}`)});
    if(w.trip==="round_trip"){const n=w.nights||[4,10];if(!(n[0]>=1&&n[1]>=n[0]))throw new Error(id+": nights must be min ≤ max")}
    resolved[id]={origins:o,destinations:d}});
  return {resolved,settings:st}}

const GH={mode:"github",
  repo:()=>LS.get("ft_repo"),token:()=>LS.get("ft_token"),branch:()=>LS.get("ft_branch")||"main",
  ready(){return !!(this.repo()&&this.token())},
  async req(path,opt={},accept="application/vnd.github+json"){
    const r=await fetch(`https://api.github.com/repos/${this.repo()}`+(path?"/"+path:""),{cache:"no-store",...opt,
      headers:{Authorization:"Bearer "+this.token(),Accept:accept,"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
    if(r.status===401)throw new Error("GitHub rejected the token (expired or revoked?) — click 🔑 to enter a new one.");
    return r},
  async raw(path){const r=await this.req(`contents/${path}?ref=${this.branch()}`,{},"application/vnd.github.raw+json");
    if(r.status===404)return null;if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}`);return r.text()},
  async info(){return{mode:"github",repo:this.repo(),branch:this.branch()}},
  async config(){const r=await this.req(`contents/watches.yaml?ref=${this.branch()}`);
    if(!r.ok)throw new Error(r.status===404?"watches.yaml not found — check the repo name":`GitHub ${r.status}`);
    const j=await r.json(),raw=jsyaml.load(b64dec(j.content))||{};let out;
    try{out=checkConfig(raw)}catch(e){raw._error=e.message;out={resolved:{},settings:{...SET_DEFAULTS,...(raw.settings||{})}}}
    return{raw,sha:j.sha,...out}},
  async putConfig(raw,sha,message){raw={...raw};delete raw._error;checkConfig(raw);
    const text=HEADER+jsyaml.dump(raw,{lineWidth:120,noRefs:true});
    const r=await this.req("contents/watches.yaml",{method:"PUT",body:JSON.stringify({message:message||"config: update via panel",content:b64enc(text),sha,branch:this.branch()})});
    if(r.status===409||r.status===422)throw new Error("watches.yaml changed on GitHub since you loaded it — reload and try again.");
    if(!r.ok)throw new Error(`GitHub ${r.status} saving config (does the token have Contents: read & write?)`);
    return{sha:(await r.json()).content.sha}},
  async state(){const t=await this.raw("data/state.json");return t?JSON.parse(t):{watches:{},meta:{}}},
  async history(id){const t=await this.raw(`data/history/${id}.csv`);return t?parseCSV(t):[]},
  async probe(){const t=await this.raw("data/probe.json");return t?JSON.parse(t):null},
  async dispatch(action,watch){const r=await this.req("actions/workflows/track.yml/dispatches",{method:"POST",body:JSON.stringify({ref:this.branch(),inputs:{action,watch:watch||""}})});
    if(!r.ok)throw new Error(`GitHub ${r.status} starting the run (does the token have Actions: read & write?)`);
    pollRun(action);return{message:`Started '${action}' on GitHub. The page refreshes when it finishes (1–10 min).`}},
  async runs(){const r=await this.req("actions/workflows/track.yml/runs?per_page=15");if(!r.ok)return[];
    return(await r.json()).workflow_runs.map(x=>({id:x.id,event:x.event,status:x.status,conclusion:x.conclusion,created_at:x.created_at,url:x.html_url}))}};

let B=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Could not load "+src));document.head.append(s)})}
async function pickBackend(){
  if(B)return;
  try{const r=await fetch("api/info",{cache:"no-store"});if(r.ok&&(await r.clone().json().catch(()=>({}))).mode){B=LOCAL;return}}catch(e){}
  B=GH;if(!window.jsyaml)await loadScript("https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js");
  $("#signout").hidden=false;
}
function showLogin(err){
  $("#dlgT").textContent="Connect to your tracker repo";
  $("#dlgB").innerHTML=`<p class="sub">This page is only a viewer/editor. Your fares, settings and history stay in your <b>private</b> GitHub repo; the token is stored only in this browser.</p>
  <div class="f2" style="grid-template-columns:1fr"><label>Repository (owner/name)<input id="l_repo" value="${esc(GH.repo()||"chintugurb/flight-tracker")}"></label>
  <label>Fine-grained token (Contents + Actions: read &amp; write on that repo only)<input id="l_tok" type="password" placeholder="github_pat_…" value=""></label></div>
  <p class="sub">Create one at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">GitHub → Settings → Fine-grained tokens</a>.</p><div class="err" id="l_err">${esc(err||"")}</div>`;
  $("#dlgF").innerHTML=`<button class="pri" id="l_go">Connect</button>`;
  $("#l_go").onclick=async()=>{LS.set("ft_repo",$("#l_repo").value.trim());LS.set("ft_token",$("#l_tok").value.trim());
    try{const r=await GH.req("");if(!r.ok)throw new Error(r.status===404?"Repo not found, or the token has no access to it.":"GitHub "+r.status);dlg.close();load()}
    catch(e){$("#l_err").textContent=/fetch/i.test(e.message)?"Could not reach api.github.com from this browser (offline, or a privacy shield / extension is blocking it). Allow api.github.com for this page and try again.":e.message}};
  dlg.showModal();
}
function signOut(){if(!confirm("Forget the token in this browser?"))return;LS.set("ft_token","");location.reload()}

let polling=false;
async function pollRun(action){if(polling)return;polling=true;const t0=Date.now();$("#busy").hidden=false;$("#busy").textContent=`⏳ ${action} running…`;
  try{for(let i=0;i<80;i++){await new Promise(r=>setTimeout(r,i<2?8000:12000));
      const rs=await GH.runs();const run=rs.find(r=>new Date(r.created_at).getTime()>=t0-90000);
      if(run&&run.status==="completed"){toast(`Run ${run.conclusion==="success"?"finished ✓":"ended: "+run.conclusion} — refreshing`,run.conclusion!=="success");
        await new Promise(r=>setTimeout(r,6000));await load();break}}}
  catch(e){toast(e.message,true)}finally{polling=false;$("#busy").hidden=true}}

async function load(){
  try{
    await pickBackend();
    if(B===GH&&!GH.ready()){showLogin();return}
    const info=await B.info();$("#mode").textContent=info.mode==="github"?`GitHub · ${info.repo}`:"Local folder mode";
    [CFG,ST]=await Promise.all([B.config(),B.state()]);
    if(CFG.raw._error)toast("Config error: "+CFG.raw._error,true);
    $("#upd").textContent=ST.meta?.last_run_at?"· last check "+ago(ST.meta.last_run_at):"";
    HIST={};await Promise.all((CFG.raw.watches||[]).map(async w=>{try{HIST[w.id]=await B.history(w.id)}catch(e){HIST[w.id]=[]}}));
    renderCards();
    if(!$("#t-activity").hidden)renderActivity();
  }catch(e){$("#cards").innerHTML=`<div class="empty err">${esc(e.message)}</div>`;if(B===GH&&/token/.test(e.message))showLogin(e.message)}
}

function spark(rows){
  const pts=rows.filter(r=>r.price!=="").map(r=>+r.price).slice(-60);
  if(pts.length<2)return`<div class="sub">${pts.length?"1 data point so far":"No history yet"}</div>`;
  const W=300,H=46,mn=Math.min(...pts),mx=Math.max(...pts),sy=v=>mx===mn?H/2:H-4-(v-mn)/(mx-mn)*(H-8);
  const d=pts.map((v,i)=>`${i?"L":"M"}${(i/(pts.length-1)*W).toFixed(1)},${sy(v).toFixed(1)}`).join("");
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="0" x2="${W}" y1="${sy(mn)}" y2="${sy(mn)}" stroke="var(--good)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/></svg>`;
}

function statusPill(w,e){
  if(w.enabled===false)return`<span class="pill">paused</span>`;
  if(!e||!e.last_run)return`<span class="pill">waiting for first run</span>`;
  if(e.empty_runs>0)return`<span class="pill warn">no fares ×${e.empty_runs}</span>`;
  return`<span class="pill ok">ok · ${ago(e.last_run)}</span>`;
}

let FILTER=LS.get("ft_filter")||"all",QUERY="";
const isIndia=w=>{const d=(CFG.resolved[w.id]||{}).destinations||[];return d.length>0&&d.every(c=>INDIA_ALL.has(c))};
function renderFilters(ws){
  const n={all:ws.length,intl:ws.filter(w=>!isIndia(w)).length,india:ws.filter(isIndia).length};
  const b=(k,l)=>`<button class="sm ${FILTER===k?"pri":""}" onclick="FILTER='${k}';LS.set('ft_filter','${k}');renderCards()">${l} (${n[k]})</button>`;
  $("#filters").innerHTML=b("all","All")+b("intl","International")+b("india","India")+
    `<input id="q" placeholder="Search name or airport…" value="${esc(QUERY)}" style="margin-left:8px;min-width:220px" oninput="QUERY=this.value;renderCards();const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)">`;
}
function renderCards(){
  const ws=CFG.raw.watches||[];
  renderFilters(ws);
  if(!ws.length){$("#cards").innerHTML=`<div class="empty">No watches yet. Click <b>+ New watch</b>.</div>`;return}
  const q=QUERY.trim().toLowerCase();
  const show=w=>(FILTER==="all"||(FILTER==="india")===isIndia(w))&&
    (!q||[w.name,w.id,...((CFG.resolved[w.id]||{}).origins||[]),...((CFG.resolved[w.id]||{}).destinations||[])].join(" ").toLowerCase().includes(q));
  const html=ws.map((w,i)=>{if(!show(w))return"";
    const e=ST.watches[w.id]||{},res=CFG.resolved[w.id]||{origins:[],destinations:[]},cov=e.coverage||{};
    const covN=Object.values(cov).filter(v=>v>0).length,covT=Object.keys(cov).length;
    const cur=e.current,low=e.low;
    const top=(e.top||[]).map(o=>`<div><span>${fmtD(o.depart)} · ${esc(o.route)}${mark(o)}</span><b>${px(o)}</b></div>`).join("");
    return`<div class="card">
      <div class="row"><h3>${esc(w.name||w.id)}</h3><span class="sp"></span>${statusPill(w,e)}</div>
      <div class="sub">${res.origins.join(", ")} → ${res.destinations.join(", ")} · ${w.trip==="round_trip"?`round trip ${w.nights?.[0]}–${w.nights?.[1]} nights`:"one way"} · next ${w.window_days||60} days · ${(w.times_ist||[]).join(" & ")||(w.runs_per_day||2)+"×/day"} IST</div>
      <div class="prices"><div><small>Latest low</small><b>${px(cur)}</b><small>${cur?esc(cur.route)+" · "+fmtD(cur.depart):""}${cur?.kind==="estimate"?`<br>incl. typical ${esc(cur.origin)}→${esc(cur.via)} ${inr(cur.est_domestic)}`:""}</small></div>
      <div><small>All-time low</small><b style="color:var(--good)">${px(low)}</b><small>${low?"seen "+ago(low.found_at):""}</small></div>
      <div><small>Alert level</small><b>${inr(e.alert_low)}</b><small>min drop ${inr(w.alert?.min_drop_inr??300)}</small></div></div>
      ${spark(HIST[w.id]||[])}
      ${top?`<div class="top">${top}</div>`:""}
      <div class="sub" style="margin:4px 0 8px">${covT?`Routes with fares: ${covN}/${covT}`:""}${cur?.links?.[0]?` · <a href="${esc(cur.links[0])}" target="_blank">Aviasales</a>`:""}${cur?.google?` · <a href="${esc(cur.google)}" target="_blank">Google Flights</a>`:""}</div>
      <div class="row"><button class="sm" onclick="editWatch(${i})">Edit</button><button class="sm" onclick="dispatch('force-run','${w.id}')">Run now</button><button class="sm" onclick="showHistory(${i})">History</button><button class="sm" onclick="togglePause(${i})">${w.enabled===false?"Resume":"Pause"}</button><span class="sp"></span><button class="sm danger" onclick="delWatch(${i})">Delete</button></div>
    </div>`}).join("");
  $("#cards").innerHTML=html||`<div class="empty">No watches match this filter.</div>`;
}

async function saveCfg(msg){
  const r=await B.putConfig(CFG.raw,CFG.sha,msg);
  CFG.sha=r.sha;toast("Saved"+(r.sha?" to GitHub":""));await load();
}
async function togglePause(i){const w=CFG.raw.watches[i];w.enabled=w.enabled===false;try{await saveCfg(`config: ${w.enabled?"resume":"pause"} ${w.id}`)}catch(e){toast(e.message,true);load()}}
async function delWatch(i){const w=CFG.raw.watches[i];if(!confirm(`Delete watch "${w.name||w.id}"? History files stay in the repo.`))return;CFG.raw.watches.splice(i,1);try{await saveCfg("config: delete "+w.id)}catch(e){toast(e.message,true);load()}}
async function dispatch(action,watch=""){try{if(B===LOCAL)toast("Running locally… this can take several minutes.");const r=await B.dispatch(action,watch);toast(r.message);if(B===LOCAL&&action!=="test-discord")setTimeout(load,1000)}catch(e){toast(e.message,true)}}

/* ---------------- watch editor ---------------- */
function chipSet(id,all,sel,labels){return`<div class="chips" id="${id}">${all.map(c=>`<span class="chip ${sel.includes(c)?"on":""}" data-v="${c}" title="${esc(labels?.[c]||"")}">${esc(labels?.[c]?(/^\d$/.test(c)?labels[c]:`${c} · ${labels[c]}`):c)}</span>`).join("")}</div>`}
function chipVals(id){return[...document.querySelectorAll(`#${id} .chip.on`)].map(c=>c.dataset.v)}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"watch"}

function editWatch(i){
  const isNew=i<0,groups=Object.keys(CFG.raw.groups||{});
  const w=isNew?{name:"",origins:groups.slice(0,1),destinations:["BKK"],trip:"one_way",window_days:90,min_lead_days:1,max_stops:1,allow_self_transfer:true,times_ist:["08:00","20:00"],nights:[4,10],alert:{min_drop_inr:300,min_drop_pct:0,target_inr:null,reset_after_days:null,alert_on_equal:false},enabled:true}:JSON.parse(JSON.stringify(CFG.raw.watches[i]));
  const orig=[].concat(w.origins||[]),dest=[].concat(w.destinations||[]),a={min_drop_inr:300,...(w.alert||{})};
  const times=w.times_ist||({1:["08:00"],2:["08:00","20:00"],3:["07:00","14:00","21:00"]}[w.runs_per_day||2]);
  const extraO=orig.filter(c=>!groups.includes(c)&&!INDIA.includes(c)),extraD=dest.filter(c=>!DESTS.includes(c));
  $("#dlgT").textContent=isNew?"New watch":"Edit · "+(w.name||w.id);
  $("#dlgB").innerHTML=`
  <fieldset><legend>Name</legend><div class="f2"><label>Watch name<input id="f_name" value="${esc(w.name||"")}" placeholder="Mandla → Bangkok"></label><label>ID (fixed after creation)<input id="f_id" value="${esc(w.id||"")}" ${isNew?"":"disabled"} placeholder="auto from name"></label></div></fieldset>
  <fieldset><legend>From — airport groups and/or airports</legend>${chipSet("f_og",groups,orig,Object.fromEntries(groups.map(g=>[g,(CFG.raw.groups[g]||[]).join("+")])))}${chipSet("f_oa",[...INDIA,...extraO],orig,AIRPORTS)}<label>Other origin codes (comma-separated IATA)<input id="f_ox" placeholder="e.g. BHO, IDR"></label></fieldset>
  <fieldset><legend>To</legend>${chipSet("f_d",[...DESTS,...extraD],dest,AIRPORTS)}<label>Other destination codes<input id="f_dx" placeholder="e.g. LHR"></label></fieldset>
  <fieldset><legend>Trip</legend><div class="f2">
    <label>Type<select id="f_trip"><option value="one_way">One way</option><option value="round_trip">Round trip</option></select></label>
    <label>Look ahead (days)<select id="f_win">${[30,45,60,90,120,180].map(d=>`<option ${d==(w.window_days||60)?"selected":""}>${d}</option>`).join("")}</select></label>
    <label>Earliest departure (days from today)<input id="f_lead" type="number" min="0" value="${w.min_lead_days??1}"></label>
    <label>Max stops<select id="f_stops">${[0,1,2].map(s=>`<option ${s==(w.max_stops??1)?"selected":""}>${s}</option>`).join("")}</select></label>
    <label class="rt">Nights min<input id="f_nmin" type="number" min="1" value="${w.nights?.[0]??4}"></label><label class="rt">Nights max<input id="f_nmax" type="number" min="1" value="${w.nights?.[1]??10}"></label></div>
    <label class="chk ow" style="margin-top:8px"><input type="checkbox" id="f_st" ${w.allow_self_transfer!==false?"checked":""}> Allow self-transfer via Indian hubs (${(CFG.raw.hubs||[]).join(", ")}) — two separate tickets</label>
    <div class="sub" style="margin-top:8px">Departure days (none = any day)</div>${chipSet("f_wd",[0,1,2,3,4,5,6].map(String),(w.weekdays||[]).map(String),Object.fromEntries(WD.map((d,i)=>[i,d])))}
  </fieldset>
  <fieldset><legend>Polling (IST)</legend><div class="f2"><label>Preset<select id="f_rpd"><option value="1">Once a day (08:00)</option><option value="2">Twice a day (08:00, 20:00)</option><option value="3">3× a day</option><option value="c">Custom</option></select></label><label>Times (HH:MM, comma-separated)<input id="f_times" value="${times.join(", ")}"></label></div><div class="sub">GitHub checks every 3 h, so a run can start up to ~3 h after the time set here.</div></fieldset>
  <fieldset><legend>Alert rule — Discord message only on a new lower low</legend><div class="f2">
    <label>Min drop ₹<input id="f_md" type="number" min="0" value="${a.min_drop_inr??0}"></label>
    <label>Min drop %<input id="f_mp" type="number" min="0" step="0.5" value="${a.min_drop_pct??0}"></label>
    <label>Target price ₹ (optional)<input id="f_tg" type="number" min="0" value="${a.target_inr??""}"></label>
    <label>Forget old low after (days)<input id="f_rs" type="number" min="0" value="${a.reset_after_days??""}" placeholder="never"></label></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="f_eq" ${a.alert_on_equal?"checked":""}> Also alert when the price equals the low (only when min drop is 0)</label>
    <label class="chk"><input type="checkbox" id="f_en" ${w.enabled!==false?"checked":""}> Enabled</label></fieldset>`;
  $("#f_trip").value=w.trip||"one_way";
  const sync=()=>{const rt=$("#f_trip").value==="round_trip";document.querySelectorAll(".rt").forEach(x=>x.style.display=rt?"":"none");document.querySelectorAll(".ow").forEach(x=>x.style.display=rt?"none":"")};$("#f_trip").onchange=sync;sync();
  const tk=times.join(","),pre={"08:00":"1","08:00,20:00":"2","07:00,14:00,21:00":"3"}[tk]||"c";$("#f_rpd").value=pre;
  $("#f_rpd").onchange=()=>{const v=$("#f_rpd").value;if(v!=="c")$("#f_times").value={1:"08:00",2:"08:00, 20:00",3:"07:00, 14:00, 21:00"}[v]};
  $("#dlgB").querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  $("#dlgF").innerHTML=`<span class="err" id="f_err" style="flex:1"></span><button onclick="dlg.close()">Cancel</button><button class="pri" id="f_save">Save watch</button>`;
  $("#f_save").onclick=async()=>{
    const codes=s=>s.split(/[ ,]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
    const nw={...w};nw.name=$("#f_name").value.trim()||"Untitled";
    if(isNew){nw.id=$("#f_id").value.trim()||slug(nw.name);let k=2,base=nw.id;while((CFG.raw.watches||[]).some(x=>x.id===nw.id))nw.id=base+"-"+k++}
    nw.origins=[...chipVals("f_og"),...chipVals("f_oa"),...codes($("#f_ox").value)];
    nw.destinations=[...chipVals("f_d"),...codes($("#f_dx").value)];
    nw.trip=$("#f_trip").value;nw.window_days=+$("#f_win").value;nw.min_lead_days=+$("#f_lead").value;nw.max_stops=+$("#f_stops").value;
    if(nw.trip==="round_trip")nw.nights=[+$("#f_nmin").value,+$("#f_nmax").value];else delete nw.nights;
    nw.allow_self_transfer=$("#f_st").checked;
    const wd=chipVals("f_wd").map(Number);if(wd.length)nw.weekdays=wd;else delete nw.weekdays;
    delete nw.runs_per_day;nw.times_ist=$("#f_times").value.split(",").map(s=>s.trim()).filter(Boolean);
    const num=v=>v===""?null:+v;
    nw.alert={min_drop_inr:+$("#f_md").value||0,min_drop_pct:+$("#f_mp").value||0,target_inr:num($("#f_tg").value),reset_after_days:num($("#f_rs").value)||null,alert_on_equal:$("#f_eq").checked};
    nw.enabled=$("#f_en").checked;
    if(!nw.origins.length||!nw.destinations.length){$("#f_err").textContent="Pick at least one origin and one destination.";return}
    const before=JSON.stringify(CFG.raw.watches||[]);CFG.raw.watches=CFG.raw.watches||[];
    if(isNew)CFG.raw.watches.push(nw);else CFG.raw.watches[i]=nw;
    try{await saveCfg(`config: ${isNew?"add":"edit"} ${nw.id}`);dlg.close();toast(isNew?"New watch saved. It runs at the next check (within 3 h) — or click Run now on its card.":"Saved. If you changed airports, window, stops or trip type, the watch restarts with a fresh low at the next check (within 3 h). Click Run now on its card to refresh immediately.")}
    catch(e){CFG.raw.watches=JSON.parse(before);$("#f_err").textContent=e.message}
  };
  dlg.showModal();
}

/* ---------------- history ---------------- */
function bigChart(rows){
  const pts=rows.filter(r=>r.price!=="").map(r=>({t:new Date(r.run_at),p:+r.price}));
  if(pts.length<2)return`<div class="empty">Not enough runs yet for a chart.</div>`;
  const W=700,H=240,L=60,B=24,mn=Math.min(...pts.map(p=>p.p)),mx=Math.max(...pts.map(p=>p.p)),pad=(mx-mn)*.1||500,y0=mn-pad,y1=mx+pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t,sx=t=>L+(t-t0)/((t1-t0)||1)*(W-L-10),sy=v=>10+(1-(v-y0)/(y1-y0))*(H-B-10);
  let run=Infinity;const lowLine=pts.map((p,i)=>{run=Math.min(run,p.p);return`${i?"L":"M"}${sx(p.t)},${sy(run)}`}).join("");
  const line=pts.map((p,i)=>`${i?"L":"M"}${sx(p.t)},${sy(p.p)}`).join("");
  const ticks=[0,.25,.5,.75,1].map(f=>y0+f*(y1-y0));
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${ticks.map(v=>`<line x1="${L}" x2="${W-10}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${inr(v)}</text>`).join("")}
  <text x="${L}" y="${H-6}" font-size="11" fill="var(--mute)">${t0.toLocaleDateString("en-IN")}</text><text x="${W-10}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--mute)">${t1.toLocaleDateString("en-IN")}</text>
  <path d="${lowLine}" fill="none" stroke="var(--good)" stroke-dasharray="4 3" stroke-width="1.5"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2"/>
  ${pts.map(p=>`<circle cx="${sx(p.t)}" cy="${sy(p.p)}" r="2.5" fill="var(--acc)"><title>${p.t.toLocaleString("en-IN")} · ${inr(p.p)}</title></circle>`).join("")}</svg>
  <div class="sub"><span style="color:var(--acc)">━</span> cheapest fare each run &nbsp; <span style="color:var(--good)">┅</span> all-time low</div>`;
}
function showHistory(i){
  const w=CFG.raw.watches[i],rows=HIST[w.id]||[];
  $("#dlgT").textContent="History · "+(w.name||w.id);
  $("#dlgB").innerHTML=bigChart(rows)+`<table style="margin-top:12px"><tr><th>Run</th><th>Low</th><th>Route</th><th>Depart</th><th>Airline</th><th>Routes w/ data</th><th></th></tr>${rows.slice(-60).reverse().map(r=>`<tr><td>${new Date(r.run_at).toLocaleString("en-IN",{dateStyle:"short",timeStyle:"short"})}</td><td><b>${r.kind==="estimate"?"≈ ":""}${inr(r.price)}</b></td><td>${esc(r.route)}${mark(r)}</td><td>${fmtD(r.depart)}${r.return?" → "+fmtD(r.return):""}</td><td>${esc(r.airline)}</td><td>${r.routes_with_data}/${r.routes_total}</td><td>${r.link?`<a href="${esc(r.link)}" target="_blank">link</a>`:""}</td></tr>`).join("")}</table>`;
  $("#dlgF").innerHTML=`<button onclick="dlg.close()">Close</button>`;dlg.showModal();
}

/* ---------------- settings ---------------- */
function renderSettings(){
  const g=CFG.raw.groups||{},s=CFG.settings||{};
  $("#t-settings").innerHTML=`<div class="card" style="max-width:820px">
  <fieldset><legend>Airport groups (use a group as the origin of a watch)</legend><div id="s_groups">${Object.entries(g).map(([k,v])=>grpRow(k,v)).join("")}</div><button class="sm" onclick="document.getElementById('s_groups').insertAdjacentHTML('beforeend',grpRow('',[]))">+ Group</button></fieldset>
  <fieldset><legend>Hub airports for self-transfer routing</legend><input id="s_hubs" style="width:100%" value="${esc((CFG.raw.hubs||[]).join(", "))}"></fieldset>
  <fieldset><legend>Tracker settings</legend><div class="f2">
    <label>Fare method<select id="s_fm">${["grouped","dates","both"].map(m=>`<option ${m===s.fare_method?"selected":""}>${m}</option>`).join("")}</select></label>
    <label>Daily digest time (IST, blank = off)<input id="s_dg" value="${esc(s.digest_time_ist||"")}"></label>
    <label>Min connection (h)<input id="s_mc" type="number" value="${s.min_connect_hours}"></label>
    <label>Max layover (h)<input id="s_ml" type="number" value="${s.max_layover_hours}"></label>
    <label>No-data warning after N runs<input id="s_nd" type="number" value="${s.no_data_alert_after}"></label>
    <label>API pause between calls (s)<input id="s_ps" type="number" step="0.05" value="${s.request_pause_s}"></label></div>
    <div class="sub" style="margin-top:6px">Secrets (Travelpayouts token, Discord webhook) live in GitHub → Settings → Secrets and variables → Actions, never here.</div></fieldset>
  <div class="row"><span class="err" id="s_err"></span><span class="sp"></span><button class="pri" onclick="saveSettings()">Save settings</button></div></div>`;
}
function grpRow(k,v){return`<div class="row grp" style="margin-bottom:6px"><input class="gk" placeholder="name" value="${esc(k)}" style="width:140px"><input class="gv" placeholder="KNU, LKO, DEL" value="${esc(v.join(", "))}" style="flex:1"><button class="sm danger" onclick="this.parentNode.remove()">✕</button></div>`}
async function saveSettings(){
  const codes=s=>s.split(/[ ,]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  const before=JSON.stringify(CFG.raw),groups={};
  document.querySelectorAll(".grp").forEach(r=>{const k=r.querySelector(".gk").value.trim().toLowerCase();if(k)groups[k]=codes(r.querySelector(".gv").value)});
  CFG.raw.groups=groups;CFG.raw.hubs=codes($("#s_hubs").value);
  CFG.raw.settings={...(CFG.raw.settings||{}),fare_method:$("#s_fm").value,digest_time_ist:$("#s_dg").value.trim(),min_connect_hours:+$("#s_mc").value,max_layover_hours:+$("#s_ml").value,no_data_alert_after:+$("#s_nd").value,request_pause_s:+$("#s_ps").value};
  try{await saveCfg("config: settings");renderSettings();toast("Watches using changed groups/hubs restart with a fresh low at the next check (within 3 h). Use Run all now to refresh immediately.")}catch(e){CFG.raw=JSON.parse(before);$("#s_err").textContent=e.message}
}

/* ---------------- activity ---------------- */
async function renderActivity(){
  const m=ST.meta||{};
  $("#t-activity").innerHTML=`<div class="grid"><div class="card"><h3>Tracker health</h3><table>
    <tr><td>Last check</td><td>${m.last_run_at?new Date(m.last_run_at).toLocaleString("en-IN")+" ("+ago(m.last_run_at)+")":"never"}</td></tr>
    <tr><td>Last check with fares</td><td>${m.last_success_at?ago(m.last_success_at):"never"}</td></tr>
    <tr><td>API calls (last evaluating run)</td><td>${m.last_api_calls??"–"}</td></tr>
    <tr><td>API errors (last run)</td><td>${(m.last_errors||[]).length}</td></tr></table>
    ${(m.last_errors||[]).length?`<pre style="font-size:11px;white-space:pre-wrap">${esc(m.last_errors.join("\n"))}</pre>`:""}</div>
    <div class="card"><h3>Recent GitHub runs</h3><div id="a_runs" class="sub">loading…</div></div></div>
    <div class="card" style="margin-top:14px"><div class="row"><h3>Phase-0 data probe</h3><span class="sp"></span><button class="sm" onclick="dispatch('probe')">Run probe</button></div><div id="a_probe" class="sub">loading…</div></div>`;
  B.runs().then(rs=>{$("#a_runs").innerHTML=rs.length?`<table>${rs.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString("en-IN",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(r.event)}</td><td><span class="pill ${r.conclusion==="success"?"ok":r.conclusion?"bad":"warn"}">${esc(r.conclusion||r.status)}</span></td><td><a href="${esc(r.url)}" target="_blank">log</a></td></tr>`).join("")}</table>`:"No runs (local mode or workflow not run yet)."}).catch(e=>$("#a_runs").textContent=e.message);
  B.probe().then(p=>{if(!p){$("#a_probe").textContent="No probe yet — click Run probe.";return}
    const ok=p.rows.filter(r=>r.in_window).length;
    $("#a_probe").innerHTML=`<p>${new Date(p.probed_at).toLocaleString("en-IN")} · ${ok}/${p.rows.length} route-method pairs had fares · ${p.api_calls} calls · ${p.errors.length} errors</p><table><tr><th>Route</th><th>Trip</th><th>Method</th><th>Dates</th><th>Min</th><th>Max</th><th>Cheapest date</th><th>Airline</th><th>Stops</th></tr>${p.rows.map(r=>`<tr style="color:var(${r.in_window?"--ink":"--mute"})"><td>${r.route}</td><td>${r.trip}</td><td>${r.method}</td><td>${r.dates}</td><td>${inr(r.min)}</td><td>${inr(r.max)}</td><td>${r.cheapest_date}</td><td>${esc(r.airline)}</td><td>${r.transfers??""}</td></tr>`).join("")}</table>`}).catch(e=>$("#a_probe").textContent=e.message);
}
load();
</script>
